<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>首页 - 校园失物招领平台</title>
<style>
  body { font-family:"Microsoft YaHei",sans-serif; margin:0; background:#f4f6f8; }
  header { background:#2e6da4; color:#fff; padding:14px 24px;
           display:flex; justify-content:space-between; }
  header a { color:#fff; margin-left:16px; text-decoration:none; }
  .filters { padding:16px 24px; display:flex; gap:12px; }
  .filters input, .filters select { padding:8px; border:1px solid #ccc; border-radius:4px; }
  .filters button { padding:8px 20px; background:#2e6da4; color:#fff; border:none;
                    border-radius:4px; cursor:pointer; }
  .list { padding:0 24px 24px; }
  .card { background:#fff; border-radius:6px; padding:16px; margin-bottom:12px;
          display:flex; justify-content:space-between; align-items:center; }
  .tag { padding:2px 8px; border-radius:4px; font-size:12px; color:#fff; }
  .lost  { background:#c0504d; }
  .found { background:#4f81bd; }
</style>
</head>
<body>
<header>
  <div>校园失物招领平台</div>
  <div>
    <a href="publish.html">发布信息</a>
    <a href="#" onclick="logout()">退出登录</a>
  </div>
</header>
<div class="filters">
  <input id="kw" placeholder="关键词">
  <select id="itemType">
    <option value="">全部类型</option>
    <option>电子产品</option><option>证件</option>
    <option>书籍</option><option>生活用品</option><option>其他</option>
  </select>
  <input id="loc" placeholder="地点">
  <select id="infoType">
    <option value="">失物 + 招领</option>
    <option value="lost">失物</option>
    <option value="found">招领</option>
  </select>
  <button onclick="loadList()">搜索</button>
</div>
<div class="list" id="list"></div>
<script>
async function loadList() {
  const params = new URLSearchParams({
    keyword:   document.getElementById('kw').value,
    item_type: document.getElementById('itemType').value,
    location:  document.getElementById('loc').value,
    info_type: document.getElementById('infoType').value
  });
  const res  = await fetch('/api/items?' + params.toString());
  const data = await res.json();
  const box  = document.getElementById('list');
  box.innerHTML = '';
  if (!data.items || data.items.length === 0) {
    box.innerHTML = '<p>暂无符合条件的信息</p>';
    return;
  }
  data.items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML =
      '<div><span class="tag ' + it.info_type + '">' +
      (it.info_type === 'lost' ? '失物' : '招领') + '</span> ' +
      '<b>' + it.item_name + '</b><br>' +
      '<small>' + it.location + ' · ' + it.event_time + '</small></div>' +
      '<a href="detail.html?id=' + it.item_id + '">查看详情</a>';
    box.appendChild(div);
  });
}
function logout() { localStorage.clear(); location.href = 'login.html'; }
loadList();
</script>
</body>
</html>
